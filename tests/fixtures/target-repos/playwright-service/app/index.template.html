<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pulse browser acceptance</title>
  </head>
  <body
    data-source-commit="__SOURCE_COMMIT__"
    data-build-id="__BUILD_ID__"
    data-deployment-id="__DEPLOYMENT_ID__"
  >
    <main>
      <h1>Pulse browser acceptance</h1>
      <p data-testid="status">Loading candidate…</p>
      <p>Reservations: <strong data-testid="reservation-count">?</strong></p>
    </main>
    <script type="module">
      const response = await fetch("/api/state");
      const state = await response.json();
      document.querySelector('[data-testid="reservation-count"]').textContent =
        String(state.reservation_count);
      document.querySelector('[data-testid="status"]').textContent =
        "Candidate deployment ready";
    </script>
  </body>
</html>
