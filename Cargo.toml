[package]
name = "pulse"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[lib]
name = "pulse"
path = "src/lib.rs"

[[bin]]
name = "pulse"
path = "src/bin/pulse.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tiny_http = "0.12"
jsonschema = { version = "0.17", features = ["draft202012"] }
ulid = "1"

[dev-dependencies]
tempfile = "3"
