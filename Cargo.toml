[package]
name = "pulse"
version = "0.1.0"
edition = "2021"

[lib]
name = "pulse"
path = "src/lib.rs"

[[bin]]
name = "pulse"
path = "src/bin/pulse.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
once_cell = "1.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
